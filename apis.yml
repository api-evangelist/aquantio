aid: aquantio
name: Aquant.io
description: >-
  Aquant is an agentic AI platform purpose-built for organizations that build,
  sell, and service complex equipment. Founded in 2016 and headquartered in New
  York, the company turns service content — equipment manuals, service histories,
  parts and warranty data, and case notes — plus the expertise inside technicians'
  heads into AI agents that help field technicians, call-center staff, and
  self-service customers diagnose issues, surface verified troubleshooting steps,
  predict equipment failure, and act faster across the entire service lifecycle.
  Access is available by web, mobile, API, and voice. Aquant serves medical-device,
  industrial, food-equipment, high-tech, printing, and energy manufacturers, with
  customers including Siemens Healthineers, The Home Depot, Sysmex, and 3D Systems.
  The company has raised roughly $113M and is backed by Insight Partners and
  Lightspeed. It is tracked in the API Evangelist network as a company profile.
